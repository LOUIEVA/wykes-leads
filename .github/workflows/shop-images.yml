name: Fetch shop product images

# Copies the Wykes shop product photos into media/shop/ so ad tools can load them.
on:
  push:
    branches: [main]
    paths: [".github/workflows/shop-images.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download product photos
        run: |
          mkdir -p media/shop
          base="https://images.leadconnectorhq.com/image/f_jpeg/q_90/r_1200/u_https://files.leadconnectorhq.com/file"
          while read -r path name; do
            curl -fsSL "$base/$path" -o "media/shop/$name.jpg"
          done <<'EOF'
          6afc055277a01e46224744c1/hit-and-miss-timber-fence.webp hit-and-miss-panel
          6afc0556a30b968e3fe44893/shiplap-timber-fence.webp shiplap-panel
          6afc054677a01e4622474386/composite-board-charcoal.webp composite-board-charcoal
          6afc054dfdf6b54fd78a95b4/concrete-gravel-board.webp concrete-gravel-board
          6afc054b893246071fdf0897/concrete-fence-post.webp concrete-fence-post
          6afc0554fdf6b54fd78a9618/post-10-concrete-mix.webp post-10-mix
          EOF
          ls -la media/shop
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add media/shop
          git diff --cached --quiet || git commit -m "Add shop product photos for ads"
          git push
