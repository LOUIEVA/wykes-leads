name: Refresh Wykes leads

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Pull leads from GoHighLevel and encrypt
        run: node scripts/build-data.mjs
        env:
          GHL_PIT: ${{ secrets.GHL_PIT }}
          GHL_LOCATION_ID: ${{ secrets.GHL_LOCATION_ID }}
          DASH_PASSCODE: ${{ secrets.DASH_PASSCODE }}
          DASH_HOOK_URL: ${{ secrets.DASH_HOOK_URL }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - id: deploy
        uses: actions/deploy-pages@v4
      # GitHub pauses scheduled jobs in repos with no activity for 60 days. Re-enable once a day.
      - name: Keep the schedule alive
        if: github.event_name == 'schedule'
        run: |
          if [ "$(date -u +%H)" = "03" ] && [ "$(date -u +%M)" -lt 5 ]; then
            gh api -X PUT "repos/${{ github.repository }}/actions/workflows/refresh.yml/enable" && echo "re-enabled"
          fi
        env:
          GH_TOKEN: ${{ github.token }}
