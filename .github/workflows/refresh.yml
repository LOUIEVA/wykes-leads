name: Refresh Wykes leads

on:
  schedule:
    - cron: "23 * * * *"   # backup only; scripts/watch.mjs starts refreshes on change
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Lead details from earlier runs, so only changed leads are fetched again (GHL allows 10,000 calls a day).
      - name: Restore lead cache
        uses: actions/cache/restore@v4
        with:
          path: .cache
          key: lead-cache-${{ github.run_id }}
          restore-keys: lead-cache-
      - name: Pull leads from GoHighLevel and encrypt
        id: build
        run: node scripts/build-data.mjs
        env:
          GHL_PIT: ${{ secrets.GHL_PIT }}
          GHL_LOCATION_ID: ${{ secrets.GHL_LOCATION_ID }}
          DASH_PASSCODE: ${{ secrets.DASH_PASSCODE }}
          DASH_HOOK_URL: ${{ secrets.DASH_HOOK_URL }}
      - name: Save lead cache
        if: always() && hashFiles('.cache/details.json') != ''
        uses: actions/cache/save@v4
        with:
          path: .cache
          key: lead-cache-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/configure-pages@v5
        if: steps.build.outputs.skip != 'true'
      - uses: actions/upload-pages-artifact@v4
        if: steps.build.outputs.skip != 'true'
        with:
          path: dist
      - id: deploy
        if: steps.build.outputs.skip != 'true'
        continue-on-error: true
        uses: actions/deploy-pages@v4
      # GitHub Pages sometimes fails with "artifact not found" for a few seconds. Try again once.
      - name: Wait before retrying the publish
        if: steps.build.outputs.skip != 'true' && steps.deploy.outcome == 'failure'
        run: sleep 20
      - id: deploy_retry
        if: steps.build.outputs.skip != 'true' && steps.deploy.outcome == 'failure'
        uses: actions/deploy-pages@v4
      - name: Make sure the GHL watcher is running
        if: always()
        run: |
          n=$(gh api "repos/${{ github.repository }}/actions/workflows/watch.yml/runs?per_page=5" -q '[.workflow_runs[] | select(.status=="in_progress" or .status=="queued" or .status=="pending" or .status=="waiting")] | length' || echo 1)
          if [ "$n" = "0" ]; then
            gh api -X POST "repos/${{ github.repository }}/actions/workflows/watch.yml/dispatches" -f ref=main && echo "watcher restarted"
          else
            echo "watcher already running"
          fi
        env:
          GH_TOKEN: ${{ github.token }}
      # GitHub pauses scheduled jobs in repos with no activity for 60 days. Re-enable once a day.
      - name: Keep the schedule alive
        if: github.event_name == 'schedule'
        run: |
          if [ "$(date -u +%H)" = "03" ]; then
            for wf in refresh.yml watch.yml; do
              gh api -X PUT "repos/${{ github.repository }}/actions/workflows/$wf/enable" && echo "re-enabled $wf"
            done
          fi
        env:
          GH_TOKEN: ${{ github.token }}
