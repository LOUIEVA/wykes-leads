name: Watch GHL for changes

# One long job checks GoHighLevel every minute and starts "Refresh Wykes leads"
# as soon as anything changes. Each job runs ~5h40m, then starts the next one.
# The schedule below only restarts the chain if it ever breaks.
on:
  workflow_dispatch:
  schedule:
    - cron: "11,41 * * * *"

permissions:
  contents: read
  actions: write

concurrency:
  group: watcher
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Watch GoHighLevel
        run: node scripts/watch.mjs
        env:
          GHL_PIT: ${{ secrets.GHL_PIT }}
          GHL_LOCATION_ID: ${{ secrets.GHL_LOCATION_ID }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
      - name: Hand over to the next watcher
        if: always() && hashFiles('.watch-ok') != ''
        run: gh api -X POST "repos/${{ github.repository }}/actions/workflows/watch.yml/dispatches" -f ref=main
        env:
          GH_TOKEN: ${{ github.token }}
